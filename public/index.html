<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventRadar & Festival Match - Universidad Andina del Cusco</title>
    <link rel="icon" href="data:,">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <!-- Styles -->
    <!-- The legacy reference sheets are archived; DESIGN.md is implemented
         once in design-system.css so no duplicate visual layer is loaded. -->
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/views.css">
    <link rel="stylesheet" href="/css/design-system.css">
</head>
<body>
    <!-- Navigation -->
    <header class="nav-header">
        <div class="nav-container">
            <div class="nav-left">
                <div class="nav-logo">
                    <div class="nav-logo-icon">
                        <span class="material-symbols-outlined">radar</span>
                    </div>
                    <span class="nav-logo-text">EventRadar</span>
                </div>
                <div class="nav-divider"></div>
                <button class="nav-location" id="navLocationBtn" type="button" aria-label="Usar mi ubicación actual" title="Usar mi ubicación actual">
                    <span class="material-symbols-outlined">my_location</span>
                    <span id="navLocationText">Seleccionar ubicación</span>
                </button>
            </div>
            
            <nav class="seg" id="mainNavSeg" aria-label="Navegación principal">
                <span class="seg-thumb" id="mainNavThumb" aria-hidden="true"></span>
                <a href="#/match" class="seg-item" data-route="radar">Radar</a>
                <a href="#/ruta" class="seg-item" data-route="ruta">Rutas &amp; Acceso</a>
                <a href="#/clima" class="seg-item" data-route="clima">Clima</a>
                <a href="#/artista" class="seg-item" data-route="artista">Artistas</a>
            </nav>
            
            <div class="nav-right">
                <button class="btn-spotify" id="spotifyLoginBtn" type="button" aria-label="Iniciar sesión con Spotify">
                    <span class="material-symbols-outlined">login</span>
                    <span>Iniciar sesión con Spotify</span>
                </button>
                <div class="nav-profile" id="navProfile" style="display: none;">
                    <img id="navProfileImg" alt="Perfil" class="nav-profile-img">
                    <span id="navProfileName" class="nav-profile-name"></span>
                    <button type="button" class="nav-profile-logout" id="logoutBtn" aria-label="Cerrar sesión" title="Cerrar sesión">
                        <span class="material-symbols-outlined">logout</span>
                    </button>
                </div>
            </div>
        </div>
    </header>
    
    <!-- Main Content -->
    <main class="main-content">
        <div id="app" class="app-container">
            <!-- Content will be rendered by router -->
        </div>
    </main>
    
    <!-- Mini Player -->
    <aside class="mini-player" id="miniPlayer" aria-label="Reproductor de Spotify" style="display: none;">
        <div class="mini-player-container">
            <div class="mini-player-info">
                <div class="mini-player-icon">
                    <span class="material-symbols-outlined">graphic_eq</span>
                </div>
                <div class="mini-player-text">
                    <div class="mini-player-title" id="miniPlayerTitle">Selecciona un evento</div>
                    <div class="mini-player-subtitle" id="miniPlayerSubtitle">Escucha la previa</div>
                </div>
            </div>
            <div class="mini-player-controls">
                <button class="mini-player-play" id="miniPlayerPlay" type="button" aria-label="Reproducir o pausar">
                    <span class="material-symbols-outlined">play_arrow</span>
                </button>
                <div class="mini-player-divider"></div>
                <button class="mini-player-spotify" id="miniPlayerSpotify" type="button" title="Abrir en Spotify" aria-label="Abrir en Spotify">
                    <span class="material-symbols-outlined">open_in_new</span>
                    <span>Spotify</span>
                </button>
            </div>
        </div>
        <div id="spotifyEmbedContainer" aria-hidden="true" style="position: fixed; left: -10000px; top: 0; width: 320px; height: 80px; opacity: 0; pointer-events: none;"></div>
    </aside>
    
    <!-- Mobile Bottom Nav -->
    <nav class="mobile-nav" aria-label="Navegación móvil">
        <a href="#/match" class="mobile-nav-link" data-route="radar">
            <span class="material-symbols-outlined">radar</span>
            <span>Radar</span>
        </a>
        <a href="#/ruta" class="mobile-nav-link" data-route="ruta">
            <span class="material-symbols-outlined">route</span>
            <span>Ruta</span>
        </a>
        <a href="#/clima" class="mobile-nav-link" data-route="clima">
            <span class="material-symbols-outlined">cloud</span>
            <span>Clima</span>
        </a>
        <a href="#/artista" class="mobile-nav-link" data-route="artista">
            <span class="material-symbols-outlined">mic</span>
            <span>Artista</span>
        </a>
    </nav>
    
    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="/js/spotify-bootstrap.js"></script>
    <script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
    <script type="module" src="/js/app.js"></script>
</body>
</html>
