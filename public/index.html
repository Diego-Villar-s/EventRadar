<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventRadar & Festival Match - Universidad Andina del Cusco</title>
    <link rel="icon" href="data:,">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <!-- Styles -->
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/app.css">
    <link rel="stylesheet" href="/css/seg-navbar.css">
    <link rel="stylesheet" href="/css/reference-match.css">
    <link rel="stylesheet" href="/css/reference-route.css">
    <link rel="stylesheet" href="/css/reference-weather.css">
    <link rel="stylesheet" href="/css/reference-artist.css">
</head>
<body>
    <!-- Navigation -->
    <header class="nav-header">
        <div class="nav-container">
            <div class="nav-left">
                <div class="nav-logo">
                    <div class="nav-logo-icon">
                        <span class="material-symbols-outlined">radar</span>
                    </div>
                    <span class="nav-logo-text">EventRadar</span>
                </div>
                <div class="nav-divider"></div>
                <button class="nav-location" id="navLocationBtn">
                    <span class="material-symbols-outlined">near_me</span>
                    <span id="navLocationText">Seleccionar ubicación</span>
                    <span class="material-symbols-outlined">expand_more</span>
                </button>
            </div>
            
            <nav class="seg" id="mainNavSeg">
                <span class="seg-thumb" id="mainNavThumb"></span>
                <a href="#/match" class="seg-item" data-route="match">Radar</a>
                <a href="#/ruta/demo" class="seg-item" data-route="ruta">Rutas & Acceso</a>
                <a href="#/clima/demo" class="seg-item" data-route="clima">Clima</a>
                <a href="#/artista/rosalia" class="seg-item" data-route="artista">Artistas</a>
            </nav>
            
            <div class="nav-right">
                <button class="nav-search-btn">
                    <span class="material-symbols-outlined">search</span>
                </button>
                <button class="btn-spotify" id="spotifyLoginBtn">
                    <span class="material-symbols-outlined">login</span>
                    <span>Iniciar sesión con Spotify</span>
                </button>
                <div class="nav-profile" id="navProfile" style="display: none;">
                    <img id="navProfileImg" alt="Perfil" class="nav-profile-img">
                    <span id="navProfileName" class="nav-profile-name"></span>
                    <button type="button" class="nav-profile-logout" id="logoutBtn" aria-label="Cerrar sesión" title="Cerrar sesión">
                        <span class="material-symbols-outlined">logout</span>
                    </button>
                </div>
            </div>
        </div>
    </header>
    
    <!-- Main Content -->
    <main class="main-content">
        <div id="app" class="app-container">
            <!-- Content will be rendered by router -->
        </div>
    </main>
    
    <!-- Mini Player -->
    <aside class="mini-player" id="miniPlayer" style="display: none;">
        <div class="mini-player-container">
            <div class="mini-player-info">
                <div class="mini-player-icon">
                    <span class="material-symbols-outlined">graphic_eq</span>
                </div>
                <div class="mini-player-text">
                    <div class="mini-player-title" id="miniPlayerTitle">Selecciona un evento</div>
                    <div class="mini-player-subtitle" id="miniPlayerSubtitle">Escucha la previa</div>
                </div>
            </div>
            <div class="mini-player-controls">
                <button class="mini-player-btn hidden-mobile" id="miniPlayerPrev">
                    <span class="material-symbols-outlined">skip_previous</span>
                </button>
                <button class="mini-player-play" id="miniPlayerPlay">
                    <span class="material-symbols-outlined">play_arrow</span>
                </button>
                <button class="mini-player-btn hidden-mobile" id="miniPlayerNext">
                    <span class="material-symbols-outlined">skip_next</span>
                </button>
                <div class="mini-player-divider"></div>
                <button class="mini-player-spotify" id="miniPlayerSpotify" title="Abrir en Spotify">
                    <span class="material-symbols-outlined">open_in_new</span>
                    <span>Spotify</span>
                </button>
            </div>
        </div>
        <div id="spotifyEmbedContainer" style="width: 0; height: 0; overflow: hidden;"></div>
    </aside>
    
    <!-- Mobile Bottom Nav -->
    <nav class="mobile-nav">
        <a href="#/match" class="mobile-nav-link" data-route="match">
            <span class="material-symbols-outlined">radar</span>
            <span>Radar</span>
        </a>
        <a href="#/ruta/demo" class="mobile-nav-link" data-route="ruta">
            <span class="material-symbols-outlined">route</span>
            <span>Ruta</span>
        </a>
        <a href="#/clima/demo" class="mobile-nav-link" data-route="clima">
            <span class="material-symbols-outlined">cloud</span>
            <span>Clima</span>
        </a>
        <a href="#/artista/rosalia" class="mobile-nav-link" data-route="artista">
            <span class="material-symbols-outlined">mic</span>
            <span>Artista</span>
        </a>
    </nav>
    
    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
    <script type="module" src="/js/app.js"></script>
</body>
</html>
