services:
  - type: web
    name: eventradar-festival-match
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: BASE_URL
        sync: false
      - key: TRUST_PROXY
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: SPOTIFY_REDIRECT_URI
        sync: false
      - key: SPOTIFY_MARKET
        value: ES
      - key: TICKETMASTER_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: GENIUS_ACCESS_TOKEN
        sync: false
      - key: MUSIXMATCH_API_KEY
        sync: false
